services:
  postgres:
    image: postgres:16-alpine
    container_name: langgraph-agentic-workflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: langgraph
      POSTGRES_DB: langgraph
    ports:
      - "5432:5432"
    volumes:
      - langgraph-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph -d langgraph"]
      interval: 5s
      timeout: 3s
      retries: 10

  # M6d placeholder — not implemented in M5. Uncomment once apps/run-api exposes a real
  # Prometheus /metrics endpoint with run counters + step-duration histograms (see
  # apps/run-api/src/server.ts's current stub /metrics route).
